# Storage and catalog access, shared by every service that reaches the lakehouse. The Kubernetes
# side gets the same four values from platform-secrets (see k8s/base/airflow.yaml); here they come
# from .env. Both names are set because the two clients disagree: Iceberg's S3FileIO and the s3a
# checkpoint filesystem read the standard AWS_* pair, while the bootstrap scripts read S3_*.
x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

# Lakekeeper's connection to its own state database. Identical in both runtimes apart from where
# the values come from -- k8s/base/iceberg-rest.yaml carries the non-secret half in a ConfigMap.
x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_HOST_R: catalog-db
  LAKEKEEPER__PG_HOST_W: catalog-db
  LAKEKEEPER__PG_PORT: "5432"
  LAKEKEEPER__PG_DATABASE: ${CATALOG_DB}
  LAKEKEEPER__PG_USER: ${CATALOG_USER}
  LAKEKEEPER__PG_PASSWORD: ${CATALOG_PASSWORD}
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${CATALOG_ENCRYPTION_KEY}
  LAKEKEEPER__LISTEN_PORT: "8181"

services:
  postgres:
    image: postgres:15
    container_name: dp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dp-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft single-node (combined broker + controller) — no Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Fixed cluster id => deterministic KRaft storage format, stable across restarts.
      CLUSTER_ID: Bvzmkif0S7ehFtrGJm7aLQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  kafka-connect:
    image: debezium/connect:2.6
    container_name: dp-kafka-connect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for the Iceberg warehouse -- see k8s/base/minio.yaml and
  # docs/migration-storage-catalog.md. Ports match the Kubernetes Service so the same endpoint
  # value works in both runtimes.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dp-minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9002 on the host, 9000 in the network. The split dates from HDFS holding 9000 for its
      # NameNode RPC; it stays because docs and scripts reference it, and only the host-side
      # mapping is affected -- in-cluster traffic addresses minio:9000 in both runtimes.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12



  catalog-db:
    image: postgres:15
    container_name: dp-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB}
      POSTGRES_USER: ${CATALOG_USER}
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_USER} -d ${CATALOG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Iceberg REST catalog -- the Compose half of k8s/base/iceberg-rest.yaml, which carries the
  # reasoning for replacing Hive Metastore. Lakekeeper refuses to serve against an unmigrated
  # database, and Compose has no init containers, so the migration runs as a one-shot service that
  # the server waits on -- the same shape as airflow-init below.
  iceberg-rest-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.1
    container_name: dp-iceberg-rest-migrate
    depends_on:
      catalog-db:
        condition: service_healthy
    command: ["migrate"]
    environment: *lakekeeper-env

  iceberg-rest:
    image: quay.io/lakekeeper/catalog:v0.13.1
    container_name: dp-iceberg-rest
    restart: unless-stopped
    depends_on:
      iceberg-rest-migrate:
        condition: service_completed_successfully
    command: ["serve"]
    ports:
      - "8181:8181"
    environment: *lakekeeper-env
    healthcheck:
      # The image ships no shell and no curl, so the healthcheck runs the server binary's own
      # subcommand rather than shelling out to an HTTP client. Kubernetes needs no equivalent:
      # there the kubelet performs the httpGet itself, from outside the container.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  trino:
    image: trinodb/trino:477
    container_name: dp-trino
    restart: unless-stopped
    user: "0:0"
    depends_on:
      # Trino resolves the warehouse location through the catalog when the Iceberg connector first
      # initializes, so a catalog that is not answering yet means a broken connector rather than a
      # slow one. MinIO holds the data those tables point at.
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    # iceberg.properties carries the endpoint and region but no credentials -- Trino's native S3
    # client reads AWS_* from the environment, exactly as k8s/base/trino.yaml supplies them.
    # Without these, table metadata reads fail with "Error processing metadata for table ...".
    environment:
      <<: *s3-env
    ports:
      - "8080:8080"
    volumes:
      - ./config/trino/etc:/etc/trino
      - ./config/trino/catalog:/etc/trino/catalog
      - .:/opt/project
      - trino_data:/var/trino/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  spark:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    image: local/payments-spark:dev
    container_name: dp-spark
    hostname: spark
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc", "while true; do sleep 3600; done"]
    environment:
      # The Kubernetes pods also set HOME=/tmp for the Ivy cache; this container runs as root, so
      # its home is writable already and run_local_job.py passes spark.jars.ivy explicitly.
      <<: *s3-env
    ports:
      - "4040:4040"
    volumes:
      - .:/opt/project

  api:
    build:
      context: .
      dockerfile: config/api/Dockerfile
    container_name: dp-api
    restart: unless-stopped
    depends_on:
      trino:
        # The API is a thin layer over Trino; starting before Trino can answer would just serve
        # 503s from /v1/ready until it caught up.
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      TRINO_HTTP_HOST: trino
      TRINO_HTTP_PORT: "8080"
      TRINO_USER: api
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: analytics
    healthcheck:
      # Liveness, not readiness: a Trino outage should not make Compose restart a healthy API.
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  statsd-exporter:
    image: prom/statsd-exporter:v0.29.0
    container_name: dp-statsd-exporter
    restart: unless-stopped
    ports:
      - "9125:9125/udp"
      - "9102:9102"
    volumes:
      - ./config/statsd/mapping.yml:/etc/statsd/mapping.yml
    command: --statsd.mapping-config=/etc/statsd/mapping.yml

  trino-exporter:
    build:
      context: ./config/trino-exporter
    container_name: dp-trino-exporter
    restart: unless-stopped
    depends_on:
      trino:
        condition: service_healthy
    ports:
      - "9104:8000"

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: dp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.6.1
    container_name: dp-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      prometheus:
        condition: service_started
      trino:
        # Wait until Trino is query-ready, otherwise the provisioned Trino
        # datasource is unreachable on a cold `up` and its health check fails.
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GF_INSTALL_PLUGINS: trino-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards

  airflow-postgres:
    image: postgres:15
    container_name: dp-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_USER} -d ${AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: ./config/airflow/Dockerfile
    container_name: dp-airflow-init
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Data --lastname Engineer --role Admin --email admin@example.com
    environment:
      <<: *s3-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@airflow-postgres/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - /var/run/docker.sock:/var/run/docker.sock

  airflow-webserver:
    build:
      context: .
      dockerfile: ./config/airflow/Dockerfile
    container_name: dp-airflow-webserver
    restart: unless-stopped
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8088:8080"
    environment:
      <<: *s3-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@airflow-postgres/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_CONN_SOURCE_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: "airflow"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    build:
      context: .
      dockerfile: ./config/airflow/Dockerfile
    container_name: dp-airflow-scheduler
    restart: unless-stopped
    user: "0:0"
    depends_on:
      airflow-webserver:
        condition: service_healthy
      spark:
        condition: service_started
    command: scheduler
    environment:
      <<: *s3-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@airflow-postgres/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SOURCE_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: "airflow"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  minio_data:
  catalog_db_data:
  grafana_data:
  trino_data:
  kafka_data:
