# Reusable: build one image, optionally publish it, and record its digest.
#
# The digest is the point. Tags are mutable -- ghcr.io/owner/payments-api:abc123 can be
# repointed -- so every downstream deployment references @sha256:... instead. That is
# what makes "build once, promote the same artifact" literally true rather than
# approximately true.
#
# Digests are published as an artifact rather than a job output because this workflow is
# called from a matrix, and matrix legs cannot emit distinct named outputs: they all
# write the same output key and the last writer wins, nondeterministically. One small
# JSON file per image, merged downstream, is the reliable pattern.
name: Docker build

on:
  workflow_call:
    inputs:
      image:
        description: Image name, without registry or tag.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile.
        required: true
        type: string
      context:
        description: Build context directory.
        required: true
        type: string
      push:
        description: >-
          Publish to GHCR. False on fork pull requests, whose GITHUB_TOKEN has no
          packages: write -- the build still runs, so a broken Dockerfile is caught.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Narrowed to this job rather than granted workflow-wide.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ github.sha }}
          # Layer cache shared across runs; without it every build reinstalls pip deps.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Record the digest
        if: ${{ inputs.push }}
        run: |
          cat > "digest-${{ inputs.image }}.json" <<JSON
          {
            "image": "${{ inputs.image }}",
            "repository": "ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}",
            "tag": "${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}"
          }
          JSON
          cat "digest-${{ inputs.image }}.json"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.push }}
        with:
          name: digest-${{ inputs.image }}
          path: digest-${{ inputs.image }}.json
          retention-days: 1
          if-no-files-found: error
