# Cloud analytics release: Databricks, Snowflake, dbt.
#
# Separate from ci.yml on purpose. This project has two deployment tracks that are not a
# dev -> prod chain: the lakehouse track (Spark/API/Airflow/Iceberg on Kubernetes) and
# this one. They implement related logic but run different workloads and ship different
# artifacts, so kind acceptance does not promote into Databricks. Modelling them as one
# chain would make "promote the same artifact" a lie, since this track has no image.
name: Cloud release

# Dispatch by hand, or automatically when a cloud asset actually changes.
#
# Both blockers this workflow was pinned for are gone: there is a live Snowflake account,
# and the Databricks targets no longer collide (they separate on schema, not workspace).
# A dispatched run has since gone green end to end, unattended.
#
# The path filter is the part worth explaining. Firing on every push to main would deploy
# production on a docs typo -- and this release is not a cheap no-op, it is a Terraform
# apply against two clouds plus a full dbt build into ANALYTICS. Every apply is another
# chance to meet state drift. Dependabot merges to main regularly and would deploy each
# time. And when the Snowflake trial lapses, an unfiltered trigger turns every merge red
# while deploying nothing, which is precisely the failure this workflow was made manual to
# escape. Scoping to the paths that change what is deployed keeps the drift protection
# without any of that.
#
# The approval gate is off: the prod environment no longer requires a reviewer. That is
# only defensible because the Terraform inputs fail closed. They did not always -- an
# earlier approved run planned `1 to destroy` on the grant the pipeline authenticates with
# and would have repointed the external stage at a placeholder bucket, having fallen back
# to defaults the workflow never supplied. It failed on an unrelated missing IAM
# permission, which was luck rather than a safeguard. s3_bucket and etl_role_users now
# have no defaults at all, so a missing value stops the run. If that ever regresses, put
# the reviewer back before touching this trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "databricks/**"
      - "snowflake_etl/dbt/**"
      - "snowflake_etl/src/**"
      - ".github/workflows/release-cloud.yml"

permissions:
  contents: read

concurrency:
  # Never let two releases race for the same Snowflake schema or bundle root.
  group: cloud-release
  cancel-in-progress: false

jobs:
  # Unattended rehearsal. Everything that can fail without touching production runs here,
  # BEFORE anyone is asked to approve.
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      schema: ${{ steps.schema.outputs.name }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # Snowflake auth, once, for every step in this job.
      #
      # Two forms of the account identifier are needed and they are not interchangeable:
      # the Terraform provider wants it SPLIT (SNOWFLAKE_ORGANIZATION_NAME +
      # SNOWFLAKE_ACCOUNT_NAME), while the Python connector and dbt want it JOINED as
      # ORG-ACCOUNT. Supplying only one form fails in whichever half you forgot.
      #
      # Key-pair, not password: it is the path load_to_snowflake.connect_from_env prefers
      # and the one Snowflake is steering everyone to as single-factor passwords are
      # deprecated. SNOWFLAKE_PRIVATE_KEY carries the PEM for Terraform; the "Materialize
      # the private key" step writes it to disk for dbt and the connector, which want a path.
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.snowflake_key.p8
      # Terraform inputs that have no safe default. s3_bucket unset used to mean
      # "repoint the external stage at payments-lake-changeme"; etl_role_users unset used to
      # mean "destroy the grant the pipeline authenticates with". Both variables now fail
      # closed, and both are supplied here so the workflow is the only place they live.
      TF_VAR_s3_bucket: ${{ vars.LAKE_S3_BUCKET }}
      TF_VAR_etl_role_users: '["${{ secrets.SNOWFLAKE_USER }}"]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v4

      - uses: databricks/setup-cli@v1.14.1

      # dbt's profile and the Python connector take a private-key *path*; the secret is a
      # PEM string. Written outside the checkout's tracked tree and mode 600.
      - name: Materialize the private key
        run: |
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          test -s "$SNOWFLAKE_PRIVATE_KEY_PATH"

      # OIDC rather than long-lived keys. The role trusts this repository's OIDC subject,
      # so no AWS secret exists to leak or rotate.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate the Databricks bundle
        working-directory: databricks
        run: databricks bundle validate -t prod

      # plan, never apply, before approval. The output goes to the job summary so the
      # reviewer approving the environment can see what they are approving.
      - name: Terraform plan
        run: |
          for stack in databricks snowflake; do
            echo "::group::terraform plan -- ${stack}"
            terraform -chdir="infra/terraform/${stack}" init -input=false
            terraform -chdir="infra/terraform/${stack}" plan -input=false -no-color \
              | tee "/tmp/plan-${stack}.txt"
            echo "::endgroup::"
          done
          {
            for stack in databricks snowflake; do
              echo "### terraform plan -- ${stack}"
              echo '```'
              tail -60 "/tmp/plan-${stack}.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - id: schema
        run: echo "name=ANALYTICS_CI_${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - run: pip install -r requirements-snowflake.txt

      # Terraform owns the infrastructure and deliberately not the tables, which are
      # workload. The landing tables get created by a load; RAW.SNAPSHOT_RUNS cannot, because
      # stg_payments reads it and this job runs dbt without ever going through the loader.
      # On a fresh account that is a hard failure at "Object does not exist", so ensure the
      # RAW objects first. Idempotent -- on an established account it is a no-op.
      - name: Ensure RAW objects exist
        run: python -m snowflake_etl.src.load_to_snowflake --bootstrap

      # The rehearsal this project could not previously do. profiles.yml already reads
      # SNOWFLAKE_SCHEMA (defaulting to ANALYTICS) and dbt_project.yml does not override
      # it, so pointing a full build at a throwaway schema needs no dbt redesign. This is
      # also the first time the schema tests and singular tests run in CI at all.
      #
      # Note what a green build means now: stg_payments resolves the newest *completed full*
      # snapshot from RAW.SNAPSHOT_RUNS, so if no run has been registered and completed, the
      # models build empty and the tests pass vacuously. That is the safe direction -- an
      # unregistered load must not look like the current state of the source -- but it means
      # this job proves the SQL compiles and runs, not that data flowed. The end-to-end proof
      # is the DAG: stage -> register -> load -> validate -> dbt.
      - name: dbt build into a disposable schema
        env:
          DBT_TARGET: trial_keypair
          SNOWFLAKE_SCHEMA: ${{ steps.schema.outputs.name }}
        run: |
          dbt build --project-dir snowflake_etl/dbt --profiles-dir snowflake_etl/dbt

      # if: always() matters more than it looks. Without it a failing dbt test -- exactly
      # the case this rehearsal exists to catch -- would leak a schema on every red run.
      - name: Drop the disposable schema
        if: always()
        env:
          DBT_TARGET: trial_keypair
          SCHEMA: ${{ steps.schema.outputs.name }}
        run: |
          python - <<'PY'
          import os

          # connect_from_env, not a second hand-rolled connection: it already resolves
          # key-pair vs password the same way every other entry point does, so this step
          # cannot drift into a different auth path than the build it is cleaning up after.
          from snowflake_etl.src.load_to_snowflake import connect_from_env

          schema = os.environ["SCHEMA"]
          connection = connect_from_env()
          try:
              connection.cursor().execute(f"DROP SCHEMA IF EXISTS {schema} CASCADE")
              print(f"dropped {schema}")
          finally:
              connection.close()
          PY
        continue-on-error: true

  # The approval gate. `environment:` is what pauses the run -- required reviewers are a
  # repository setting, not YAML, so this job blocks until a human approves.
  release:
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.snowflake_key.p8
      # Terraform inputs that have no safe default. s3_bucket unset used to mean
      # "repoint the external stage at payments-lake-changeme"; etl_role_users unset used to
      # mean "destroy the grant the pipeline authenticates with". Both variables now fail
      # closed, and both are supplied here so the workflow is the only place they live.
      TF_VAR_s3_bucket: ${{ vars.LAKE_S3_BUCKET }}
      TF_VAR_etl_role_users: '["${{ secrets.SNOWFLAKE_USER }}"]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Materialize the private key
        run: |
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          test -s "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - uses: hashicorp/setup-terraform@v4

      - uses: databricks/setup-cli@v1.14.1

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Infrastructure before the workloads that depend on it: the Unity Catalog schema
      # and volume must exist before a bundle deploys into them, and the Snowflake
      # warehouse/role/stage before dbt writes through them.
      - name: Apply Databricks governance
        run: |
          terraform -chdir=infra/terraform/databricks init -input=false
          terraform -chdir=infra/terraform/databricks apply -input=false -auto-approve

      - name: Deploy the Databricks bundle
        working-directory: databricks
        run: databricks bundle deploy -t prod

      - name: Apply Snowflake governance
        run: |
          terraform -chdir=infra/terraform/snowflake init -input=false
          terraform -chdir=infra/terraform/snowflake apply -input=false -auto-approve

      - run: pip install -r requirements-snowflake.txt

      - name: dbt build into ANALYTICS
        env:
          DBT_TARGET: trial_keypair
          SNOWFLAKE_SCHEMA: ANALYTICS
        run: dbt build --project-dir snowflake_etl/dbt --profiles-dir snowflake_etl/dbt

      - name: Record what shipped
        if: always()
        run: |
          {
            echo '### Cloud release'
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- rehearsed in: \`${{ needs.rehearse.outputs.schema }}\`"
            echo "- Databricks bundle target: \`prod\`"
            echo ""
            echo 'Rollback is not uniform across this track:'
            echo '- Databricks: redeploy the previous known-good bundle revision.'
            echo '- dbt: redeploy the previous model revision **where schema-compatible**.'
            echo '- Terraform/Snowflake: revert or forward-fix. There is no automatic'
            echo '  rollback for destructive DDL, and pretending otherwise would be worse'
            echo '  than saying so.'
          } >> "$GITHUB_STEP_SUMMARY"
