name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more (packages: write for GHCR,
# id-token: write for OIDC) opt in individually as those stages land.
permissions:
  contents: read

# A PR that gets a second push should not keep spending runners on the first commit.
# Note this does not deduplicate triggers: push is scoped to main and pull_request to
# PRs targeting main, so a feature-branch commit already fires exactly once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install ruff==0.15.15

      - run: ruff check .

  # The bucket list lives in tests/buckets.yml so the matrix and the inventory guard
  # read the same source. tests/test_bucket_inventory.py fails if the two drift.
  test-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install PyYAML==6.0.3

      - id: build
        name: Build the bucket matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import yaml

          with open("tests/buckets.yml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)

          # Every bucket measures the same sources -- see the note in buckets.yml.
          cov = " ".join(f"--cov={source}" for source in config["coverage_sources"])
          matrix = [
              {"name": name, "paths": " ".join(bucket["paths"]), "cov": cov}
              for name, bucket in sorted(config["buckets"].items())
          ]
          print(f"matrix={json.dumps(matrix)}")
          PY

  test:
    needs: test-matrix
    strategy:
      # One red bucket should not hide the state of the other five.
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_python-tests.yml
    with:
      bucket: ${{ matrix.bucket.name }}
      paths: ${{ matrix.bucket.paths }}
      cov: ${{ matrix.bucket.cov }}

  # The one job branch protection should require. Splitting the suite splits its coverage
  # data too; combining here keeps a single project-wide threshold instead of silently
  # turning one 80% gate into six much harsher ones.
  coverage-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          # Without merge-multiple each artifact lands in its own subdirectory and
          # `coverage combine` finds nothing to combine.
          merge-multiple: true

      - name: Fail if no coverage data was collected
        run: |
          shopt -s nullglob dotglob
          fragments=(.coverage.*)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "::error::No .coverage.* fragments were downloaded." >&2
            echo "The gate must not pass on an empty data set." >&2
            exit 1
          fi
          echo "Combining ${#fragments[@]} fragment(s): ${fragments[*]}"

      - name: Combine and enforce the project threshold
        run: |
          coverage combine
          coverage report --show-missing --fail-under=80

      - name: Publish the combined report
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Combined coverage'
            echo '```'
            coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bundle-static:
    # Structural validation of the Asset Bundle with no credentials and no network:
    # resolves include globs, checks notebook paths exist, and checks every
    # ${resources.*} reference names a declared resource. Safe on fork PRs, where
    # secrets are unavailable -- which is exactly why the authenticated check below
    # cannot run on every trigger.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - run: python scripts/validate_databricks_bundle.py

  bundle-authenticated:
    # `databricks bundle validate` authenticates: the dev target is mode: development,
    # which resolves workspace identity to prefix resources. So it runs only on main,
    # where secrets are available -- and it FAILS when they are missing rather than
    # reporting a green check that never ran.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1.9.0

      - name: Require credentials
        run: |
          missing=()
          [ -n "${DATABRICKS_HOST}"  ] || missing+=(DATABRICKS_HOST)
          [ -n "${DATABRICKS_TOKEN}" ] || missing+=(DATABRICKS_TOKEN)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}" >&2
            echo "Set them in repo settings; this check is not allowed to pass unconfigured." >&2
            exit 1
          fi

      - name: Validate bundle
        working-directory: databricks
        run: databricks bundle validate -t dev

  terraform:
    # Formats + validates the Databricks governance Terraform. `validate` needs
    # only the provider (downloaded by `init -backend=false`), no credentials, so
    # the job is a real check out-of-the-box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/databricks fmt -check -recursive

      - name: Terraform init + validate
        run: |
          terraform -chdir=infra/terraform/databricks init -backend=false
          terraform -chdir=infra/terraform/databricks validate

  dbt:
    # Parses the dbt project (model compilation, ref()/source() resolution, schema.yml).
    # `dbt parse` never opens a connection -- profiles.yml falls back to parse-only env-var
    # defaults -- so this is a real check that needs no Snowflake credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install dbt-snowflake==1.11.6

      - run: dbt parse --project-dir snowflake_etl/dbt --profiles-dir snowflake_etl/dbt

  snowflake-terraform:
    # Formats + validates the Snowflake + S3 governance Terraform. Like the Databricks
    # job, `validate` only needs the providers (downloaded by `init -backend=false`), no
    # Snowflake/AWS credentials, so it is a real check out-of-the-box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/snowflake fmt -check -recursive

      - name: Terraform init + validate
        run: |
          terraform -chdir=infra/terraform/snowflake init -backend=false
          terraform -chdir=infra/terraform/snowflake validate
