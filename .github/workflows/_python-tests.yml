# Reusable: run one test bucket and publish its coverage fragment.
#
# Called once per bucket from ci.yml's matrix, which is generated from tests/buckets.yml.
# Deliberately enforces no coverage threshold: the fragments are combined downstream and
# the project-wide 80% gate is applied once, in ci.yml's coverage-gate job.
#
# This is the first candidate for extraction into a shared platform repository -- see
# Phase 7. Nothing in it is specific to this repo beyond the requirements file name.
name: Python tests (bucket)

on:
  workflow_call:
    inputs:
      bucket:
        description: Bucket name, used for artifact names and the JUnit report.
        required: true
        type: string
      paths:
        description: Space-separated test paths to run.
        required: true
        type: string
      cov:
        description: Pre-formatted --cov= flags for this bucket's sources.
        required: true
        type: string

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ inputs.bucket }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # COVERAGE_FILE writes the fragment directly under its final name. This is not
      # just tidier than a follow-up `mv`: a plain `pytest --cov` run ERASES pre-existing
      # .coverage.* siblings on startup, so the mv approach only survives because each
      # bucket gets its own runner. Naming the file up front makes the same sequence
      # reproducible locally, which is what the verification steps in the plan rely on.
      #
      # The dotted name is not cosmetic either: bare `coverage combine` discovers exactly
      # .coverage.* and nothing else, so a name like coverage-api would leave the gate
      # combining zero files and passing on no data.
      - name: Run ${{ inputs.bucket }} tests
        env:
          COVERAGE_FILE: .coverage.${{ inputs.bucket }}
        run: >-
          pytest ${{ inputs.paths }}
          ${{ inputs.cov }}
          --cov-report=
          --junitxml=junit-${{ inputs.bucket }}.xml

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.bucket }}
          path: .coverage.${{ inputs.bucket }}
          # upload-artifact@v4 skips dotfiles by default; without this the upload
          # silently contains nothing and coverage-gate passes on an empty set.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ inputs.bucket }}
          path: junit-${{ inputs.bucket }}.xml
          retention-days: 7
          if-no-files-found: error
