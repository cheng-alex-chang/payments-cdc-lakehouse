[pytest]
# config/spark/jobs is on the path because the jobs do `from common import ...`. At runtime
# Python adds the submitted script's own directory to sys.path; pytest imports them directly,
# so it has to be told.
pythonpath = . config/spark/jobs
markers =
    integration: real-cloud tests (AWS S3 / Snowflake); skipped unless the matching
        AWS_*/SNOWFLAKE_* credentials are set in the environment.
