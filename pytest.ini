[pytest]
# config/spark/jobs is on the path because the jobs do `from common import ...`. At runtime
# Python adds the submitted script's own directory to sys.path; pytest imports them directly,
# so it has to be told.
pythonpath = . config/spark/jobs

# The default run is the fast suite: ~330 tests in about a second, no Docker, no
# credentials. integration_cdc needs nine containers and minutes, so it is opt-in --
# a command-line -m overrides this, which is how CI selects it.
addopts = -m "not integration_cdc"
markers =
    integration: real-cloud tests (AWS S3 / Snowflake); skipped unless the matching
        AWS_*/SNOWFLAKE_* credentials are set in the environment.
    integration_cdc: end-to-end CDC chain against nine local containers
        (Postgres -> Debezium -> Kafka -> Spark -> Iceberg -> Trino). Needs Docker and
        several minutes, so it is excluded from the fast suite and selected explicitly:
        `pytest -m integration_cdc tests/integration/test_cdc_chain.py`.
