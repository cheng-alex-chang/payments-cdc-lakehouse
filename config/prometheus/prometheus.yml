global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: trino
    static_configs:
      - targets: ["trino-exporter:8000"]

  # Serving API: request rate, latency histogram, and snapshot-cache hit ratio. Same target name
  # resolves under both Compose (service name) and Kubernetes (Service DNS).
  - job_name: payments-api
    static_configs:
      - targets: ["api:8000"]
