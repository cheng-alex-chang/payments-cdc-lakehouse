connector.name=iceberg

# Iceberg REST catalog, replacing the Hive Metastore Thrift endpoint. Trino discovers the
# warehouse prefix from the catalog's /v1/config response, the same way Spark does, so both
# engines agree on table locations without either being told where the files are.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181/catalog
iceberg.rest-catalog.warehouse=payments

# Native S3 support. fs.hadoop.enabled is off: with object storage there is no Hadoop filesystem
# left to fall back to, and leaving it on hides configuration mistakes behind a second code path.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
# MinIO addresses buckets by path rather than DNS subdomain.
s3.path-style-access=true
