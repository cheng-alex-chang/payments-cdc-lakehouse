# Adds the GHCR pull secret to every workload's pod spec.
#
# kind nodes do not inherit the runner's `docker login`, so a newly created GHCR package
# -- which GitHub makes private by default -- fails with ImagePullBackOff. Making the
# packages public by hand in the UI would also work, but it is a manual step that has to
# be repeated for every new image and silently breaks acceptance when someone forgets.
#
# Attached to the pod specs rather than to the ServiceAccounts because a ServiceAccount's
# imagePullSecrets are injected at pod ADMISSION: patching the SA after `kubectl apply`
# would leave the already-created pods without it, and they would retry forever.
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: ghcr-pull
