apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ephemeral acceptance overlay for CI. Proves the immutable GHCR artifacts deploy under
# the project's real manifests and produce correct data, then the cluster is destroyed.
# Not a persistent environment and not something that promotes into Databricks/Snowflake.
#
# Two deliberate non-changes, both from measuring rather than assuming:
#
# Resources are NOT trimmed. Always-on workloads request 4.6Gi; the five operational Jobs
# ship suspended and CI activates them one at a time, so peak is ~5.6Gi on a 16GB runner.
# The naive all-at-once sum of 8.1Gi never occurs.
#
# Observability is NOT dropped. scripts/k8s_verify.sh waits on grafana and prometheus by
# name, and tests/test_validate_k8s_manifests.py asserts that list matches the manifests.
# Removing them here would mean forking the verification script, trading a real readiness
# check for a bit of headroom that measurement says is not needed.

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

# Mirrors k8s/overlays/local. CI generates secrets.env with throwaway values at job time;
# the cluster is destroyed minutes later and never leaves the runner.
secretGenerator:
  - name: platform-secrets
    namespace: data-pipeline
    literals:
      - POSTGRES_DB=payments
      - POSTGRES_USER=dataeng
      - CATALOG_DB=catalog
      - CATALOG_USER=catalog
      - AIRFLOW_DB=airflow
      - AIRFLOW_USER=airflow
      - AIRFLOW_ADMIN_USERNAME=admin
      - MINIO_ROOT_USER=payments
    envs:
      - secrets.env

# Spark Jobs resolve Iceberg/Kafka jars with --packages into spark.jars.ivy=/tmp/.ivy2,
# which is pod-local. Three Jobs would each re-fetch ~100MB from Maven Central, inside
# the cluster where actions/cache cannot reach. The patch points that path at a hostPath
# the kind node maps to the runner's cached directory -- see k8s/kind-config-ci.yaml.
patches:
  - path: ivy-cache-patch.yaml
    target:
      kind: Job
      labelSelector: app.kubernetes.io/component=processing

# Image digests are NOT set here. A committed overlay cannot contain a digest that does
# not exist yet, so the deploy job runs `kustomize edit set image` against the manifest
# produced by the build stage. See .github/workflows/_deploy-k8s.yml.
images: []
