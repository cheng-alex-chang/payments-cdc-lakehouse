# Kubernetes override of config/trino/etc/config.properties.
#
# Identical to the Compose file plus four memory ceilings. The kind cluster packs every service
# onto a single node, so Trino gets a much smaller share of the host than it does under Compose.
# Without these caps Trino sizes its pools off total container memory and the pod is OOMKilled
# under Iceberg scans. Paired with the smaller -Xmx in overrides/trino-jvm.config.
#
# One of exactly three files that legitimately differ between runtimes -- see docs/kubernetes.md.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=256MB
query.max-total-memory=384MB
query.max-memory-per-node=128MB
memory.heap-headroom-per-node=128MB
