apiVersion: v1
kind: Service
metadata:
  name: statsd-exporter
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: statsd-exporter
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: statsd-exporter
  ports:
    - name: statsd
      port: 9125
      targetPort: statsd
      protocol: UDP
    - name: metrics
      port: 9102
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsd-exporter
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: statsd-exporter
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statsd-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statsd-exporter
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: statsd-exporter
          image: prom/statsd-exporter:v0.29.0
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          args:
            - --statsd.mapping-config=/etc/statsd/mapping.yml
          ports:
            - name: statsd
              containerPort: 9125
              protocol: UDP
            - name: metrics
              containerPort: 9102
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: statsd-config
              mountPath: /etc/statsd/mapping.yml
              subPath: mapping.yml
      volumes:
        - name: statsd-config
          configMap:
            name: statsd-config
---
apiVersion: v1
kind: Service
metadata:
  name: trino-exporter
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: trino-exporter
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: trino-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-exporter
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: trino-exporter
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino-exporter
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: trino-exporter
          image: local/trino-exporter:dev
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.1
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          env:
            # The "Payments Gold (Trino)" datasource is a plugin, not a core Grafana type; without
            # this the provisioned datasource loads as "unknown" and every gold panel stays blank.
            - name: GF_INSTALL_PLUGINS
              value: trino-datasource
            # Credentials for the provisioned "Payments Postgres" datasource. Same secret the
            # source database itself reads, so they cannot fall out of step.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            # Mirrors the Compose bind mounts: provisioning under /etc/grafana/provisioning and
            # dashboard JSON under the path dashboards.yml points at. The dashboards mount nests
            # inside grafana-data, which Kubernetes handles -- the later mount shadows the dir.
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
