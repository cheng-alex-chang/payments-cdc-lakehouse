# Iceberg REST catalog — replaces Hive Metastore.
#
# Hive Metastore is the legacy half of the old stack, not HDFS: Thrift RPC, a relational database of
# its own, no fine-grained access control, no credential vending. A REST catalog replaces all of it
# with an HTTP contract any engine can speak without a Thrift client.
#
# The catalog's state lives in catalog-db -- the Postgres instance that used to back Hive Metastore,
# reused rather than replaced. With Hive gone, that instance's primary database *is* the catalog
# database, so nothing has to create a second one.
#
# Engines authenticate to object storage themselves; the catalog does not sign their S3 requests.
# See the Phase 3 section of docs/migration-storage-catalog.md for why that is not optional.
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/component: catalog
spec:
  selector:
    app.kubernetes.io/name: iceberg-rest
  ports:
    - name: http
      port: 8181
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/component: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iceberg-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iceberg-rest
        app.kubernetes.io/component: catalog
    spec:
      initContainers:
        # Lakekeeper keeps its schema in Postgres and will not serve against an unmigrated
        # database. Running migrate as an init container means a restart re-checks rather than
        # requiring a separate Job that has to be ordered by hand.
        - name: migrate
          image: quay.io/lakekeeper/catalog:v0.13.1
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: iceberg-rest-config }
          env:
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_USER }
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_PASSWORD }
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_ENCRYPTION_KEY }
      containers:
        - name: iceberg-rest
          image: quay.io/lakekeeper/catalog:v0.13.1
          args: ["serve"]
          # Rust, not a JVM: no heap to size. Hive Metastore reserved 512 Mi and capped at 1024 Mi
          # purely to contain its JVM.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8181
          envFrom:
            - configMapRef: { name: iceberg-rest-config }
          env:
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_USER }
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_PASSWORD }
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: CATALOG_ENCRYPTION_KEY }
          # /health is unauthenticated and reports whether the catalog can reach its database.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iceberg-rest-config
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/component: catalog
data:
  # Non-secret connection shape. Credentials arrive separately from platform-secrets so nothing
  # sensitive is ever in a ConfigMap.
  LAKEKEEPER__PG_HOST_R: catalog-db
  LAKEKEEPER__PG_HOST_W: catalog-db
  LAKEKEEPER__PG_PORT: "5432"
  LAKEKEEPER__PG_DATABASE: catalog
  LAKEKEEPER__LISTEN_PORT: "8181"
