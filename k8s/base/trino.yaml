apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: trino
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: query
    spec:
      containers:
        - name: trino
          image: trinodb/trino:477
          # overrides/trino-jvm.config caps the heap at 512M, but a JVM needs metaspace, thread
          # stacks, and direct buffers on top of it. Without a request the scheduler treats this
          # pod as free and packs the node until the kernel OOM-kills it (observed: 15 restarts).
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1280Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: trino-etc
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-etc
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: trino-etc
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: trino-catalog
              mountPath: /etc/trino/catalog
            - name: hadoop-config
              mountPath: /etc/hadoop/conf
            - name: trino-data
              mountPath: /var/trino/data
      volumes:
        - name: trino-etc
          configMap:
            name: trino-etc
        - name: trino-catalog
          configMap:
            name: trino-catalog
        - name: hadoop-config
          configMap:
            name: hadoop-config
        - name: trino-data
          emptyDir: {}
