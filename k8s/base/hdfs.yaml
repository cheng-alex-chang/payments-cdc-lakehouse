apiVersion: v1
kind: Service
metadata:
  name: namenode
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: namenode
    app.kubernetes.io/component: hdfs
spec:
  # Headless: this Service governs the namenode StatefulSet, and stable per-pod DNS
  # (namenode-0.namenode.<ns>.svc.cluster.local) only exists when clusterIP is None. A
  # ClusterIP here would also put a load balancer in front of an HDFS RPC endpoint, which
  # expects to be addressed directly.
  clusterIP: None
  selector:
    app.kubernetes.io/name: namenode
  ports:
    - name: rpc
      port: 9000
      targetPort: rpc
    - name: http
      port: 9870
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: namenode
    app.kubernetes.io/component: hdfs
spec:
  serviceName: namenode
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: namenode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: namenode
        app.kubernetes.io/component: hdfs
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: namenode
          image: apache/hadoop:3
          # The NameNode holds the entire filesystem namespace in heap -- every file, block, and
          # Iceberg metadata object -- so it grows with the table count, not with data volume.
          # At 1Gi it was OOM-killed mid-run once gold reached 8,764 hourly buckets, which takes
          # HDFS down and every consumer (Hive Metastore, Spark, Trino) with it.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
          command:
            - /bin/bash
            - -lc
            - |
              if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
                hdfs namenode -format -force -nonInteractive
              fi
              hdfs namenode
          ports:
            - name: rpc
              containerPort: 9000
            - name: http
              containerPort: 9870
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: namenode-data
              mountPath: /tmp/hadoop-root/dfs/name
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: namenode-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: datanode
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: datanode
    app.kubernetes.io/component: hdfs
spec:
  # Headless, and load-bearing. hdfs-site.xml sets dfs.datanode.use.datanode.hostname=true, so
  # the DataNode registers with the NameNode under its stable per-pod name
  # (datanode-0.datanode.<ns>.svc.cluster.local) and every HDFS *client* resolves that name to
  # read blocks. StatefulSet per-pod DNS only exists when the governing Service is headless, so
  # with a ClusterIP the name does not resolve and reads fail with UnknownHostException -- while
  # writes, which the NameNode brokers, appear to succeed.
  clusterIP: None
  selector:
    app.kubernetes.io/name: datanode
  ports:
    - name: http
      port: 9864
      targetPort: http
    # Block transfer and client IPC. Clients talk to the DataNode on 9866 directly; omitting it
    # left the Service describing only the web UI.
    - name: data
      port: 9866
      targetPort: 9866
    - name: ipc
      port: 9867
      targetPort: 9867
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: datanode
    app.kubernetes.io/component: hdfs
spec:
  serviceName: datanode
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datanode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datanode
        app.kubernetes.io/component: hdfs
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: datanode
          image: apache/hadoop:3
          # Sized alongside the NameNode: the DataNode restarted ten times at the previous limit
          # while Spark was writing, and a flapping DataNode fails reads even when writes look fine.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
          command:
            - hdfs
            - datanode
          ports:
            - name: http
              containerPort: 9864
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: datanode-data
              mountPath: /tmp/hadoop-root/dfs/data
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: datanode-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-init
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: hdfs-init
    app.kubernetes.io/component: hdfs
spec:
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs-init
        app.kubernetes.io/component: hdfs
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hdfs-init
          image: apache/hadoop:3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          env:
            - name: HADOOP_USER_NAME
              value: root
          command:
            - /bin/bash
            - -lc
            - |
              until hdfs dfs -ls / >/dev/null 2>&1; do
                sleep 2
              done
              until hdfs dfsadmin -report 2>/dev/null | grep -q "Live datanodes ([1-9]"; do
                sleep 2
              done
              hdfs dfs -mkdir -p /warehouse/analytics.db /checkpoints/bronze /checkpoints/silver /checkpoints/gold
              hdfs dfs -chmod 777 /warehouse /warehouse/analytics.db /checkpoints /checkpoints/bronze /checkpoints/silver /checkpoints/gold
          volumeMounts:
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
