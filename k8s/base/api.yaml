apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: serving
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: serving
    spec:
      containers:
        - name: api
          # Built and loaded into kind by scripts/k8s_up.sh; never pulled from a registry.
          image: local/payments-api:dev
          imagePullPolicy: IfNotPresent
          # Small by design: the API holds no dataset, only a bounded response cache. Trino does
          # the heavy lifting.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TRINO_HTTP_HOST
              value: trino
            - name: TRINO_HTTP_PORT
              value: "8080"
            - name: TRINO_USER
              value: api
            - name: TRINO_CATALOG
              value: iceberg
            - name: TRINO_SCHEMA
              value: analytics
          # Liveness deliberately does not touch Trino. If it did, a warehouse outage would
          # restart every API pod -- turning a degraded read path into a crashloop.
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness does require Trino: an instance that cannot reach the warehouse has
          # nothing to serve, so it should leave the Service endpoints until it can.
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 15
            periodSeconds: 15
