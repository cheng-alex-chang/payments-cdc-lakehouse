apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: processing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-job-runner
  namespace: data-pipeline
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  # KubernetesPodOperator streams the driver's output back into the Airflow task log; without
  # pods/log the task runs blind and a Spark failure surfaces only as a non-zero exit.
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-job-runner
  namespace: data-pipeline
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: data-pipeline
roleRef:
  kind: Role
  name: spark-job-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-bronze
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: spark-bronze
    app.kubernetes.io/component: processing
spec:
  suspend: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-bronze
        app.kubernetes.io/component: processing
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      containers:
        - name: spark
          image: spark:3.5.8-python3
          command:
            - /opt/spark/bin/spark-submit
            # local[2] rather than local[*]: on a multi-core node local[*] starts one task thread
            # per core inside a single JVM, and each carries its own shuffle and read buffers.
            # These datasets are small, so extra threads buy nothing and multiply memory.
            - --master
            - local[2]
            # Without an explicit heap the JVM sizes its default maximum off the node's total
            # memory, ignoring the pod it lives in, and the kernel OOM-kills the driver. Keep the
            # heap well under the container limit below, which also covers metaspace and off-heap.
            - --driver-memory
            - 1g
            - --conf
            - spark.jars.ivy=/tmp/.ivy2
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4
            - /opt/project/config/spark/jobs/bronze_from_kafka.py
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: HADOOP_CONF_DIR
              value: /opt/spark/conf
          # An unbounded Spark driver is the classic way to take a Kubernetes node down: with no
          # requests the scheduler cannot reason about the pod at all, and with no limit the JVM
          # grows until the kernel picks a victim. The limit is roughly twice the driver heap to
          # leave room for metaspace, thread stacks, and off-heap buffers.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
            - name: spark-jobs
              mountPath: /opt/project/config/spark/jobs
            - name: hadoop-config
              mountPath: /opt/spark/conf/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/spark/conf/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: spark-checkpoints
        - name: spark-jobs
          configMap:
            name: spark-jobs
        - name: hadoop-config
          configMap:
            name: hadoop-config
---
