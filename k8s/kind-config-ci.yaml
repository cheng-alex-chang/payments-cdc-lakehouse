# kind configuration for the CI acceptance cluster.
#
# Identical to k8s/kind-config.yaml apart from extraMounts, which exposes the runner's
# cached Ivy directory inside the node. k8s/overlays/ci then hostPath-mounts it into the
# three Spark Jobs, so their --packages resolution is cached across CI runs.
#
# Kept separate rather than added to the shared config so a local `bash scripts/k8s_up.sh`
# does not gain a dependency on a host directory that only CI creates.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./.ci-cache/ivy
        containerPath: /ivy-cache
