# Databricks Asset Bundle for the payments medallion pipeline.
# Deploy with the Databricks CLI: `databricks bundle deploy -t dev`.
bundle:
  name: payments-pipeline

include:
  - resources/*.yml

# Free Edition provides exactly one workspace, so dev and prod cannot be separated the way
# this bundle originally assumed. They do not have to be: what actually collided was never
# the deployment path. Verified with `bundle validate` on Free Edition, the two targets
# already land in different roots:
#
#   dev   /Workspace/Users/<me>/.bundle/payments-pipeline/dev
#   prod  /Workspace/Users/<me>/.bundle/payments-pipeline/prod
#
# (Note prod stays under the user path here rather than /Shared -- Free Edition has no
# /Shared root to fall back to. The suffix is what separates them, not the prefix.)
#
# The collision was the *target schema*. Both targets published bronze/silver/gold to
# workspace.analytics, so a prod deploy overwrote the tables dev was using.
#
# Separating on schema instead of workspace makes both deployable side by side. Be clear
# about what that buys and what it does not: the tables no longer collide, but this is one
# workspace with one permissions boundary and one pool of serverless compute. A runaway dev
# pipeline can still starve prod. It is a working arrangement for a single-workspace tier,
# not an isolation guarantee -- point `prod` at its own workspace host the day there is one
# and nothing else here has to change.
variables:
  target_schema:
    description: Unity Catalog schema the medallion publishes into; separates dev from prod.
    default: analytics

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9e931fd5-a7b1.cloud.databricks.com
    variables:
      target_schema: analytics_dev

  # Deployed only by .github/workflows/release-cloud.yml, after a required reviewer
  # approves the `prod` GitHub Environment.
  #
  # mode: production is not cosmetic -- it drops the per-user resource prefixing and
  # `development` pause that mode: development applies, so the job schedules are real.
  #
  # The host is deliberately not hardcoded. The CLI reads DATABRICKS_HOST from the
  # environment, supplied by the workload-identity federation configured for the prod
  # environment. That keeps the production workspace out of the repository and lets this
  # target point at a separate workspace without a code change.
  #
  # root_path is explicit because `mode: production` requires it -- the CLI refuses to
  # infer one, so that only ever one copy of the bundle is deployed. The comment this
  # replaces claimed the default was already /Shared/.bundle/<name>/<target>; it is not,
  # and Free Edition has no /Shared root to fall back to. `bundle validate -t prod` failed
  # on this from the day the target was written, and went unnoticed because the workflow
  # that runs it was manual-only and had never been dispatched.
  #
  # Interpolated rather than hardcoded to an address, and it keeps ${bundle.target} so dev
  # and prod stay in separate roots in the one workspace Free Edition provides.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      target_schema: analytics
